[project]
name = "nemo_text_processing"
description = "NeMo text processing for ASR and TTS"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
maintainers = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
keywords = [
  "NeMo",
  "asr",
  "inverse text normalization",
  "language",
  "nvidia",
  "text normalization",
  "text processing",
  "tts",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "cdifflib>=1.2.9",
  "editdistance>=0.8.1",
  "inflect>=7.5.0",
  "joblib>=1.6.0",
  "pandas>=3.0.6",
  "pynini>=2.1.7",
  "regex>=2026.9.10",
  "sacremoses>=0.2.0",
  "tqdm>=4.70.1",
  "transformers>=5.17.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NVIDIA/NeMo-text-processing"
Repository = "https://github.com/NVIDIA/NeMo-text-processing"

[project.optional-dependencies]
all = [
  "nemo_text_processing[test]",
]
test = [
  "black>=25.1.0",
  "click>=8.5.0",
  "isort>=6.0.1",
  "parameterized>=0.9.0",
  "pytest>=9.1.1",
]

[dependency-groups]
dev = [
  "nemo_text_processing[all]",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.black]
skip-string-normalization = true
line-length = 119

[tool.isort]
known_localfolder = ["nemo", "tests"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 119

[tool.setuptools.dynamic]
version = { attr = "nemo_text_processing.package_info.__version__" }

[tool.setuptools.packages.find]
include = ["nemo_text_processing*"]

[tool.setuptools.package-data]
"*" = ["*.tsv", "*.far", "*.fst"]
