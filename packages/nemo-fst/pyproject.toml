[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-fst"
version = "0.1.0.dev0"
description = "Apply prebuilt OpenFst grammars with lookahead composition."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA", email = "nemo-toolkit@nvidia.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["nemo_fst"]

[tool.pytest.ini_options]
# A prepared artifact is ~13 MB; keep only what a failure needs.
tmp_path_retention_policy = "failed"
# Benchmarks are slow and machine-dependent; run them with `pytest -m benchmark`.
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: performance measurement, deselected unless -m benchmark is given",
]
pythonpath = [".", "tests"]
# Listed rather than globbed so they run in order of consequence: if two OpenFst
# copies cannot share a process, nothing below it means anything.
testpaths = [
    "tests/test_coexistence.py",
    "tests/test_differential.py",
    "tests/test_integration.py",
    "tests/test_bytes.py",
    "tests/test_cache.py",
    "tests/test_benchmark.py",
]

# NOTE: this configuration has not been exercised -- no container runtime was
# available where it was written. Treat the first CI run as the real test.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
archs = ["x86_64", "aarch64"]
before-all = "bash scripts/build_openfst.sh /usr/local"
environment = { OPENFST_PREFIX = "/usr/local" }
test-requires = "pytest"
# The wheel must actually carry a working lookahead build; a silent fallback to
# a plain OpenFst would produce a package that imports and does nothing useful.
test-command = "python -c \"import nemo_fst; assert nemo_fst.has_lookahead()\""

[tool.cibuildwheel.linux]
# The archives are linked in, so there is no external OpenFst for auditwheel to
# bundle; it still rewrites tags and checks the symbol surface.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
